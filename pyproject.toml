[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lynxflow"
version = "0.1.0"
description = "Local-first desktop prompt engineering for developers, powered by Ollama."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "LynxFlow contributors" }]
keywords = ["ollama", "prompt-engineering", "desktop", "pyside6", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pyside6>=6.7.0",
  "qasync>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "sqlmodel>=0.0.21",
  "alembic>=1.13.0",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.3",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-qt>=4.4.0",
  "pre-commit>=3.7.0",
  "respx>=0.21.0",
  "mypy>=1.11.0",
]

[project.scripts]
lynxflow = "app.main:main"

[project.urls]
Homepage = "https://github.com/master2it/lynxflow"
Repository = "https://github.com/master2it/lynxflow"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
  "integration: tests that need a real Ollama instance (skipped in CI by default)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
packages = ["app"]
